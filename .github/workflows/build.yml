# With some help from: https://gist.github.com/dgerosa/2e1f47a39180f39bde848e38243efa94

name: build
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - source: resumes/laxman-kr/cv.tex
            artifact: Laxman_KR_Resume.pdf
          - source: resumes/sraya-rajan/cv.tex
            artifact: Sraya_Rajan_Resume.pdf
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
      - name: Build ${{ matrix.artifact }}
        uses: dante-ev/latex-action@latest
        with:
          root_file: ${{ matrix.source }}
          working_directory: .
          args: -xelatex -latexoption=-file-line-error -latexoption=-interaction=nonstopmode
      - name: Package PDF
        run: |
          mkdir -p github_artifacts
          if [ -f cv.pdf ]; then src=cv.pdf; else src="$(dirname "${{ matrix.source }}")/cv.pdf"; fi
          mv "$src" "github_artifacts/${{ matrix.artifact }}"
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./github_artifacts
  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: github_artifacts
      - name: Assemble site
        run: |
          mkdir -p github_deploy/sraya
          mv github_artifacts/*/* github_deploy/
          cp site/index.html github_deploy/index.html
          cp site/CNAME github_deploy/CNAME
          cp site/sraya/index.html github_deploy/sraya/index.html
      - name: deploy on orphan branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./github_deploy
          publish_branch: build
          force_orphan: true
          enable_jekyll: true
